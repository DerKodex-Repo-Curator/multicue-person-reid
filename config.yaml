model:
  # Plain person detector. Used when --no-pose is passed.
  yolo_weights: yolov8n.pt
  # Pose detector. This gives boxes + 17 human keypoints and is the preferred mode.
  pose_weights: yolov8n-pose.pt
  use_pose: true
  yolo_conf: 0.35
  person_class_id: 0

identity:
  # Face is the strongest cue, but only when the face crop is clear enough.
  face_cosine_threshold: 0.38
  face_confirm_threshold: 0.45

  # Body/appearance is deliberately weaker because clothes dominate it.
  body_cosine_threshold: 0.62

  # Geometry/silhouette are for same-person continuity, not absolute identity.
  geometry_cosine_threshold: 0.55
  silhouette_cosine_threshold: 0.50
  pose_min_keypoint_conf: 0.25

  min_combined_score: 0.58
  max_missing_frames: 45
  min_box_iou_for_track: 0.05

  # Multi-cue fusion. Face dominates only when available. Geometry matters more than clothing.
  face_weight: 0.50
  geometry_weight: 0.25
  silhouette_weight: 0.15
  body_weight: 0.10

outputs:
  save_every_n_frames: 1
  draw_debug: true
  crop_padding: 0.08
