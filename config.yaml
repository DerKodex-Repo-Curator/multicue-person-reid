model:
  yolo_weights: yolov8n.pt
  pose_weights: yolov8n-pose.pt
  use_pose: true
  yolo_conf: 0.35
  person_class_id: 0

runtime:
  # On Apple Silicon, run_camera.py --device auto prefers PyTorch MPS for YOLO.
  # Use --device cpu if MPS is unstable on your setup.
  device: auto
  imgsz: 416
  face_det_size: 320

identity:
  face_cosine_threshold: 0.42
  face_confirm_threshold: 0.50
  body_cosine_threshold: 0.78
  geometry_cosine_threshold: 0.55
  silhouette_cosine_threshold: 0.50
  pose_min_keypoint_conf: 0.25
  min_combined_score: 0.62
  max_missing_frames: 45
  min_box_iou_for_track: 0.05
  face_weight: 0.68
  geometry_weight: 0.17
  silhouette_weight: 0.10
  body_weight: 0.05

outputs:
  save_every_n_frames: 1
  draw_debug: true
  crop_padding: 0.08
