model:
  yolo_weights: yolov8n.pt
  yolo_conf: 0.35
  person_class_id: 0

identity:
  # Higher means stricter. Tune depending on your video quality.
  face_cosine_threshold: 0.38
  body_cosine_threshold: 0.72
  min_combined_score: 0.62
  max_missing_frames: 45
  min_box_iou_for_track: 0.08
  face_weight: 0.65
  body_weight: 0.35

outputs:
  save_every_n_frames: 1
  draw_debug: true
  crop_padding: 0.08
